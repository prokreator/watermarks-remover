# Checks AXS Official Resale for the configured show every 5 minutes and
# alerts on Telegram. Setup: axs-resale-bot/README.md ("Run it from the web").
# Needs repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID; the rest are
# optional repo variables with the defaults below.
name: AXS resale watch

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub's shortest schedule; runs can start a few minutes late
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: axs-resale-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: axs-resale-bot
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AXS_EVENT_URL: ${{ vars.AXS_EVENT_URL || 'https://www.axs.com/uk/events/1457846/asake-tickets' }}
      EVENT_NAME: ${{ vars.EVENT_NAME || 'Asake - The O2 London - Thu 15 Oct 2026' }}
      MATCH_KEYWORDS: ${{ vars.MATCH_KEYWORDS || 'standing' }}
      MAX_PRICE: ${{ vars.MAX_PRICE }}
      STATE_FILE: ${{ github.workspace }}/axs-state/state.json
      PROFILE_DIR: ${{ github.workspace }}/axs-state/browser-profile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: axs-resale-bot/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Remembers what was already alerted, paused state and button presses
      # between runs. Each run saves a new cache entry; the newest is restored.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: axs-state
          key: axs-state-${{ github.run_id }}
          restore-keys: axs-state-

      - name: Check AXS resale
        run: |
          mkdir -p "$GITHUB_WORKSPACE/axs-state"
          python bot.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: axs-state
          key: axs-state-${{ github.run_id }}
